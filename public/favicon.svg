    <clipPath id="case-clip"><use href="#case-shape"/></clipPath>
    <clipPath id="screen-clip"><use href="#screen-shape"/></clipPath>

    <linearGradient id="case-base" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f7ecd5"/>
      <stop offset=".29" stop-color="#ecd9b3"/>
      <stop offset=".72" stop-color="#efdfba"/>
      <stop offset=".93" stop-color="#c6ae7e"/>
      <stop offset="1" stop-color="#ad9565"/>
    </linearGradient>
    <linearGradient id="case-front" x1=".15" y1="0" x2=".8" y2="1">
      <stop stop-color="#f8ecd2"/>
      <stop offset=".34" stop-color="#e8d2aa"/>
      <stop offset=".7" stop-color="#f2e1bd"/>
      <stop offset="1" stop-color="#e5cfa4"/>
    </linearGradient>
    <linearGradient id="edge-light" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#9e8559" stop-opacity=".36"/>
      <stop offset=".035" stop-color="#fff6de" stop-opacity=".12"/>
      <stop offset=".095" stop-color="#fff8e6" stop-opacity=".5"/>
      <stop offset=".2" stop-color="#fff5df" stop-opacity="0"/>
      <stop offset=".84" stop-color="#967e50" stop-opacity="0"/>
      <stop offset=".95" stop-color="#9a8050" stop-opacity=".08"/>
      <stop offset="1" stop-color="#806c49" stop-opacity=".4"/>
    </linearGradient>
    <linearGradient id="bottom-bevel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#c2a774" stop-opacity="0"/>
      <stop offset=".28" stop-color="#c2a774" stop-opacity=".1"/>
      <stop offset=".52" stop-color="#a68b58" stop-opacity=".56"/>
      <stop offset="1" stop-color="#8a744b" stop-opacity=".33"/>
    </linearGradient>
    <linearGradient id="top-light" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fffbec" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fffbec" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="recess-bevel" x1=".35" y1="0" x2=".55" y2="1">
      <stop stop-color="#af9870"/>
      <stop offset=".08" stop-color="#827550"/>
      <stop offset=".27" stop-color="#9b885d"/>
      <stop offset=".57" stop-color="#dac49a"/>
      <stop offset=".87" stop-color="#f2e3c1"/>
      <stop offset="1" stop-color="#f8ebcd"/>
    </linearGradient>
    <linearGradient id="recess-side-light" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#756a49" stop-opacity=".48"/>
      <stop offset=".12" stop-color="#756a49" stop-opacity="0"/>
      <stop offset=".83" stop-color="#ffffe6" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffe6" stop-opacity=".35"/>
    </linearGradient>
    <radialGradient id="glass" cx=".47" cy=".47" r=".73">
      <stop stop-color="#0a2922"/>
      <stop offset=".43" stop-color="#10251e"/>
      <stop offset=".8" stop-color="#222c1d"/>
      <stop offset="1" stop-color="#383a27"/>
    </radialGradient>
    <radialGradient id="glass-vignette" cx=".5" cy=".51" r=".67">
      <stop offset=".57" stop-color="#000a06" stop-opacity="0"/>
      <stop offset=".86" stop-color="#000804" stop-opacity=".3"/>
      <stop offset="1" stop-color="#000603" stop-opacity=".72"/>
    </radialGradient>
    <linearGradient id="glass-top-shadow" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#000500" stop-opacity=".77"/>
      <stop offset=".16" stop-color="#000500" stop-opacity=".14"/>
      <stop offset=".48" stop-color="#000500" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="phosphor-spill">
      <stop stop-color="#00cbb9" stop-opacity=".12"/>
      <stop offset="1" stop-color="#00b9a8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="crt-scanlines" width="8" height="5.8" patternUnits="userSpaceOnUse">
      <path d="M0 .8H8" stroke="#b5c9a3" stroke-opacity=".055" stroke-width="1"/>
      <path d="M0 4.1H8" stroke="#000702" stroke-opacity=".19" stroke-width="1.6"/>
    </pattern>

    <filter id="plastic-texture" x="-2%" y="-2%" width="104%" height="104%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".68" numOctaves="3" seed="17" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grain"/>
      <feComponentTransfer in="grain" result="faint-grain"><feFuncA type="linear" slope=".24"/></feComponentTransfer>
      <feComposite in="faint-grain" in2="SourceGraphic" operator="in" result="clipped-grain"/>
      <feBlend in="SourceGraphic" in2="clipped-grain" mode="soft-light"/>
    </filter>
    <filter id="glass-texture" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".46" numOctaves="2" seed="31" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grain"/>
      <feComponentTransfer in="grain" result="faint-grain"><feFuncA type="linear" slope=".12"/></feComponentTransfer>
      <feComposite in="faint-grain" in2="SourceGraphic" operator="in" result="clipped-grain"/>
      <feBlend in="SourceGraphic" in2="clipped-grain" mode="soft-light"/>
    </filter>
    <filter id="soft-3" x="-15%" y="-30%" width="130%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="soft-8" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="reflection-blur" x="-40%" y="-50%" width="180%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="ground-shadow" x="-20%" y="-180%" width="140%" height="460%"><feGaussianBlur stdDeviation="15"/></filter>
    <filter id="cyan-halo" filterUnits="userSpaceOnUse" x="295" y="310" width="615" height="565"><feGaussianBlur stdDeviation="11"/></filter>
    <filter id="cyan-bloom" filterUnits="userSpaceOnUse" x="315" y="325" width="585" height="535"><feGaussianBlur stdDeviation="3.5"/></filter>
  </defs>

  <g id="computer">
    <ellipse cx="626" cy="1176" rx="417" ry="13" fill="#5d4a2a" opacity=".17" filter="url(#ground-shadow)"/>
    <g id="case" filter="url(#plastic-texture)">
      <use href="#case-shape" fill="url(#case-base)"/>
      <g clip-path="url(#case-clip)">
        <use href="#face-shape" fill="url(#case-front)" filter="url(#soft-8)"/>
        <path d="M110 286C120 169 172 104 288 104H984C1062 104 1115 149 1132 221L1099 250C1004 198 276 195 140 280Z" fill="url(#top-light)" filter="url(#soft-8)"/>
        <path d="M90 1048C143 1101 179 1119 266 1117H1004C1085 1116 1125 1086 1163 1047V1201H90Z" fill="url(#bottom-bevel)" filter="url(#soft-3)"/>
        <use href="#case-shape" fill="url(#edge-light)"/>
        <path d="M145 1017C146 1066 162 1089 213 1107" fill="none" stroke="#fff7df" stroke-width="17" stroke-linecap="round" opacity=".2" filter="url(#soft-8)"/>
        <use href="#recess-shape" fill="#96815a" opacity=".34" filter="url(#soft-8)"/>
        <use href="#recess-shape" fill="url(#recess-bevel)" filter="url(#soft-8)"/>
        <use href="#recess-shape" fill="url(#recess-side-light)" filter="url(#soft-8)"/>
        <path d="M180 848C187 931 202 960 273 974C458 1001 792 998 973 973C1038 961 1058 930 1071 860" fill="none" stroke="#fff5dc" stroke-opacity=".62" stroke-width="11" filter="url(#soft-8)"/>
        <path d="M211 197C290 183 927 183 990 199" fill="none" stroke="#fff4d8" stroke-opacity=".54" stroke-width="6" filter="url(#soft-3)"/>
      </g>
    </g>

    <g id="crt-screen">
      <use href="#screen-shape" fill="#0b1008" stroke="#504d32" stroke-width="3"/>
      <g clip-path="url(#screen-clip)">
        <use href="#screen-shape" fill="url(#glass)" filter="url(#glass-texture)"/>
        <use href="#screen-shape" fill="url(#glass-vignette)"/>
        <use href="#screen-shape" fill="url(#glass-top-shadow)"/>
        <ellipse cx="606" cy="600" rx="370" ry="340" fill="url(#phosphor-spill)"/>
        <use href="#screen-shape" fill="url(#crt-scanlines)"/>
        <path d="M232 342C240 287 290 263 346 260L316 285C276 305 259 328 249 361Z" fill="#e0e2c3" opacity=".27" filter="url(#reflection-blur)"/>
        <path d="M225 341C228 295 256 274 293 266" fill="none" stroke="#dce7c5" stroke-width="3" opacity=".16" filter="url(#soft-3)"/>
        <g id="ascii-monogram" fill="none" stroke-linecap="round">
          <use href="#scanline-a" stroke="#00dfc9" stroke-width="12" opacity=".8" filter="url(#cyan-halo)"/>
          <use href="#scanline-a" stroke="#00ffeb" stroke-width="9" opacity=".88" filter="url(#cyan-bloom)"/>
          <use href="#scanline-a" stroke="#12f4e3" stroke-width="6.5"/>
          <use href="#scanline-a" stroke="#a2fff0" stroke-width="1.4" opacity=".56"/>
        </g>
      </g>
    </g>

    <g id="wordmark" aria-label="AIDevCourse">
      <use href="#brand-wordmark" transform="translate(0 1.2)" fill="#fff1cf" opacity=".5"/>
      <use href="#brand-wordmark" fill="#555641" opacity=".94"/>
    </g>
  </g>
</svg>

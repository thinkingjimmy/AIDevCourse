# [INPUT]: Pull requests and main-branch changes with a frozen pnpm lockfile.
# [OUTPUT]: Quality and browser gates with best-effort evidence uploads.
# [POS]: Repository CI; test fixtures never enter the deployment build.
# [PROTOCOL]: Update this header when making changes, then check README.md.
name: Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm check
      - run: pnpm build
      - run: pnpm test:e2e
      - run: CONTENT_TEST=1 pnpm build
      - run: CONTENT_TEST=1 pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: browser-evidence
          path: |
            test-results/
            playwright-report/
            docs/evidence/screenshots/
          retention-days: 14
